<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Youth Football Scout DB | 5万青年球员数据库</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0d1117;color:#e6e6e6;min-height:100vh;line-height:1.5}
.header{background:linear-gradient(135deg,#0d2818,#1a472a,#0d2818);border-bottom:2px solid #d4a843;padding:1rem 2rem;text-align:center}
.header h1{font-size:1.5rem;color:#d4a843}
.header .sub{font-size:.75rem;color:#8b949e;margin-top:.1rem}
#status{padding:.6rem 1.5rem;text-align:center;font-size:.8rem;color:#d4a843;background:#161b22;border-bottom:1px solid #30363d}
.controls{background:#161b22;border-bottom:1px solid #30363d;padding:.7rem 1.5rem;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:center;position:sticky;top:0;z-index:99}
.controls label{font-size:.7rem;color:#8b949e}
select,input[type=text]{background:#21262d;border:1px solid #30363d;color:#e6e6e6;padding:.3rem .5rem;border-radius:4px;font-size:.75rem;outline:none}
select:focus,input:focus{border-color:#d4a843}
#ageDisplay{background:#1a472a;color:#d4a843;padding:.15rem .4rem;border-radius:3px;font-weight:700;font-size:.8rem}
input[type=range]{-webkit-appearance:none;height:4px;background:#30363d;border-radius:2px;outline:none;width:60px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:#d4a843;border-radius:50%;cursor:pointer}
.sort-btn{background:#21262d;border:1px solid #30363d;color:#e6e6e6;padding:.3rem .5rem;border-radius:4px;font-size:.7rem;cursor:pointer}
.sort-btn:hover,.sort-btn.active{background:#1a472a;border-color:#d4a843;color:#d4a843}
#count{font-size:.75rem;color:#8b949e;padding:.4rem 1.5rem}
#count span{color:#d4a843}
.grid{padding:0 1rem 1rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.8rem}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:#d4a843}
.card-top{background:linear-gradient(135deg,#1a2a1e,#1e1e2e);padding:.7rem;display:flex;align-items:center;gap:.5rem;border-bottom:1px solid #30363d}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:#fff;flex-shrink:0;border:1px solid #30363d}
.av-fw{background:linear-gradient(135deg,#7f1d1d,#dc2626)}.av-mf{background:linear-gradient(135deg,#1e3a5f,#2563eb)}
.av-df{background:linear-gradient(135deg,#14532d,#16a34a)}.av-gk{background:linear-gradient(135deg,#78716c,#d6d3d1)}
.card-info{flex:1;min-width:0}
.card-name{font-size:.95rem;font-weight:700;color:#fff}
.card-tags{display:flex;gap:.3rem;margin-top:.2rem;flex-wrap:wrap}
.tag{font-size:.6rem;padding:.1rem .35rem;border-radius:6px;font-weight:600}
.tag-age{background:#1a472a;color:#d4a843}.tag-pos{background:#21262d;color:#e6e6e6;border:1px solid #30363d}
.tag-club{background:#21262d;color:#8b949e}
.card-stats{padding:.5rem .7rem;display:grid;grid-template-columns:1fr 1fr 1fr;gap:.3rem;border-bottom:1px solid #21262d}
.stat{text-align:center}.stat-v{font-size:.95rem;font-weight:700;color:#fff}.stat-l{font-size:.55rem;color:#8b949e}
.card-score{padding:.5rem .7rem}
.score-top{display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem}
.score-num{font-size:1.3rem;font-weight:800;color:#d4a843}
.score-bar{flex:1;height:5px;background:#21262d;border-radius:2px;overflow:hidden}
.score-fill{height:100%;border-radius:2px}
.s-hi{background:#22c55e}.s-md{background:#eab308}.s-lo{background:#ef4444}
.dims{display:grid;grid-template-columns:repeat(5,1fr);gap:.2rem;margin-top:.3rem}
.dim{text-align:center;font-size:.5rem}.dim em{font-size:.7rem}.dim b{font-weight:700;font-size:.7rem;display:block}
.detail{display:none;padding:.6rem;background:#1a1d2e;border-top:1px solid #30363d;font-size:.65rem}
.detail.open{display:block}
.d-title{color:#d4a843;margin-bottom:.4rem}
.d-row{margin-bottom:.3rem}
.d-row-h{display:flex;justify-content:space-between}.d-row-s{font-weight:700;color:#d4a843}
.d-row-b{height:4px;background:#21262d;border-radius:2px;margin:.1rem 0;overflow:hidden}
.d-row-bf{height:100%}.d-row-t{color:#8b949e}
@media(max-width:768px){.grid{grid-template-columns:1fr;padding:0 .5rem .5rem}}
@media(min-width:1400px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>

<header class="header">
<h1>⚽ Youth Football Scout DB</h1>
<div class="sub">全球22岁及以下 · 5万青年球员 · 每周一12:00更新</div>
</header>

<div id="status">正在加载数据...</div>

<div class="controls">
  <label>年龄</label>
  <span id="ageDisplay">16-22</span>
  <input type="range" id="ageMin" min="16" max="22" value="16">
  <input type="range" id="ageMax" min="16" max="22" value="22">
  <label>位置</label>
  <select id="posF"><option value="all">全部</option><option>ST</option><option>LW</option><option>RW</option><option>CAM</option><option>CM</option><option>CDM</option><option>CB</option><option>LB</option><option>RB</option><option>GK</option></select>
  <label>国籍</label>
  <select id="natF"><option value="all">全部</option></select>
  <input type="text" id="search" placeholder="🔍 搜索姓名...">
  <button class="sort-btn active" data-s="o">评分</button>
  <button class="sort-btn" data-s="a">年龄</button>
  <button class="sort-btn" data-s="g">进球</button>
  <button class="sort-btn" data-s="u">潜力</button>
  <button class="sort-btn" data-s="v">身价</button>
</div>

<div id="count">显示 0 名球员</div>
<div class="grid" id="grid"></div>

<script src="players_data.js"></script>
<script>
// === Flag to Name ===
const F2N={"🏴󠁧󠁢󠁥󠁮󠁧󠁿":"英格兰","🇪🇸":"西班牙","🇫🇷":"法国","🇩🇪":"德国","🇮🇹":"意大利","🇳🇱":"荷兰","🇵🇹":"葡萄牙","🇧🇷":"巴西","🇦🇷":"阿根廷","🇧🇪":"比利时","🇭🇷":"克罗地亚","🇷🇸":"塞尔维亚","🇩🇰":"丹麦","🇸🇪":"瑞典","🇳🇴":"挪威","🇵🇱":"波兰","🇨🇿":"捷克","🇦🇹":"奥地利","🇨🇭":"瑞士","🇹🇷":"土耳其","🇺🇦":"乌克兰","🇬🇷":"希腊","🏴󠁧󠁢󠁳󠁣󠁴󠁿":"苏格兰","🇮🇪":"爱尔兰","🏴󠁧󠁢󠁷󠁬󠁳󠁿":"威尔士","🇺🇾":"乌拉圭","🇨🇴":"哥伦比亚","🇪🇨":"厄瓜多尔","🇨🇱":"智利","🇵🇾":"巴拉圭","🇲🇽":"墨西哥","🇺🇸":"美国","🇨🇦":"加拿大","🇯🇵":"日本","🇰🇷":"韩国","🇳🇬":"尼日利亚","🇬🇭":"加纳","🇸🇳":"塞内加尔","🇨🇮":"科特迪瓦","🇨🇲":"喀麦隆","🇲🇦":"摩洛哥","🇩🇿":"阿尔及利亚","🇪🇬":"埃及","🇹🇳":"突尼斯","🇿🇦":"南非","🇦🇺":"澳大利亚","🇨🇳":"中国","🇮🇷":"伊朗","🇸🇦":"沙特","🇶🇦":"卡塔尔","🇵🇪":"秘鲁","🇻🇪":"委内瑞拉","🇧🇴":"玻利维亚","🇨🇷":"哥斯达黎加","🇵🇦":"巴拿马","🇸🇰":"斯洛伐克","🇸🇮":"斯洛文尼亚","🇭🇺":"匈牙利","🇷🇴":"罗马尼亚","🇧🇬":"保加利亚","🇨🇾":"塞浦路斯"};
const PC={'ST':'av-fw','LW':'av-fw','RW':'av-fw','CAM':'av-fw','CM':'av-mf','CDM':'av-mf','CB':'av-df','LB':'av-df','RB':'av-df','GK':'av-gk'};

var all=[],sort='o',desc=true,R=0,PAGE=50;

// === Process raw data ===
var st=document.getElementById('status');
st.textContent='正在处理数据...';

all=DB.pl.map(function(p,i){
  var s=p.sc;
  return{
    id:'p'+i,n:p.n,a:p.a,f:p.f,nat:F2N[p.f]||'',c:p.c,po:p.p,h:p.h,
    ft:p.ft==='R'?'Right':p.ft==='L'?'Left':'Both',v:p.v,
    st:{ap:p.s[0],g:p.s[1],as:p.s[2],xg:p.r[0],rt:p.r[1]},
    sc:{t:{s:s.t.s,d:s.t.d},p:{s:s.p.s,d:s.p.d},c:{s:s.c.s,d:s.c.d},i:{s:s.i.s,d:s.i.d},u:{s:s.u.s,d:s.u.d}},
    o:p.o
  };
});
st.textContent='✅ '+all.length.toLocaleString()+' 名球员已就绪';
setTimeout(function(){st.style.display='none'},1500);

// === Nations ===
(function(){
  var s=new Set(),sel=document.getElementById('natF'),arr=[];
  all.forEach(function(p){if(!s.has(p.nat)){s.add(p.nat);arr.push({f:p.f,n:p.nat});}});
  arr.sort(function(a,b){return a.n.localeCompare(b.n);});
  arr.forEach(function(x){var o=document.createElement('option');o.value=x.f;o.textContent=x.f+' '+x.n;sel.appendChild(o);});
})();

// === Filter ===
function filtered(){
  var amin=+document.getElementById('ageMin').value,amax=+document.getElementById('ageMax').value;
  var pf=document.getElementById('posF').value,nf=document.getElementById('natF').value;
  var q=document.getElementById('search').value.toLowerCase();
  var r=all.filter(function(p){
    if(p.a<amin||p.a>amax)return false;
    if(pf!=='all'&&p.po!==pf)return false;
    if(nf!=='all'&&p.f!==nf)return false;
    if(q&&p.n.toLowerCase().indexOf(q)===-1)return false;
    return true;
  });
  var k={'o':function(p){return p.o},'a':function(p){return p.a},'g':function(p){return p.st.g},'u':function(p){return p.sc.u.s},'v':function(p){return p.v||0}};
  r.sort(function(a,b){return desc?k[sort](b)-k[sort](a):k[sort](a)-k[sort](b);});
  return r;
}

// === Card ===
function card(p){
  var sc=p.o>=8.5?'s-hi':p.o>=7.5?'s-md':'s-lo';
  var dc=function(s){return s>=8.5?'s-hi':s>=7.5?'s-md':'s-lo';};
  var mv=p.v>=1e8?'€'+(p.v/1e6).toFixed(0)+'M':p.v>=1e6?'€'+(p.v/1e6).toFixed(1)+'M':'';
  var d=p.sc;
  var div=document.createElement('div');div.className='card';
  div.innerHTML='<div class="card-top" onclick="this.parentElement.querySelector(\'.detail\').classList.toggle(\'open\')">'+
    '<div class="av '+(PC[p.po]||'av-mf')+'">'+p.po+'</div>'+
    '<div class="card-info"><div class="card-name">'+p.f+' '+p.nat+' · '+p.n+'</div>'+
    '<div class="card-tags"><span class="tag tag-age">'+p.a+'岁</span><span class="tag tag-pos">'+p.po+'</span><span class="tag tag-club">'+p.c+'</span>'+(mv?'<span class="tag" style="background:#2d1f0e;color:#d4a843">💰'+mv+'</span>':'')+'</div></div></div>'+
    '<div class="card-stats"><div class="stat"><div class="stat-v">'+p.st.ap+'</div><div class="stat-l">出场</div></div><div class="stat"><div class="stat-v">'+p.st.g+' ⚽</div><div class="stat-l">进球</div></div><div class="stat"><div class="stat-v">'+p.st.as+' 🎯</div><div class="stat-l">助攻</div></div></div>'+
    '<div class="card-score" onclick="this.parentElement.querySelector(\'.detail\').classList.toggle(\'open\')">'+
    '<div class="score-top"><span class="score-num">'+p.o+'</span><div class="score-bar"><div class="score-fill '+sc+'" style="width:'+(p.o*10)+'%"></div></div></div>'+
    '<div class="dims"><div class="dim"><em>🎯</em><b>'+d.t.s+'</b></div><div class="dim"><em>💪</em><b>'+d.p.s+'</b></div><div class="dim"><em>🧠</em><b>'+d.c.s+'</b></div><div class="dim"><em>⚡</em><b>'+d.i.s+'</b></div><div class="dim"><em>🚀</em><b>'+d.u.s+'</b></div></div></div>'+
    '<div class="detail"><div class="d-title">📋 详细球探报告</div>'+
    dr('🎯 技术',d.t,dc(d.t.s))+dr('💪 身体',d.p,dc(d.p.s))+dr('🧠 战术',d.c,dc(d.c.s))+dr('⚡ 影响',d.i,dc(d.i.s))+dr('🚀 潜力',d.u,dc(d.u.s))+'</div>';
  return div;
}
function dr(l,d,c){return'<div class="d-row"><div class="d-row-h"><span>'+l+'</span><span class="d-row-s">'+d.s+'/10</span></div><div class="d-row-b"><div class="d-row-bf '+c+'" style="width:'+(d.s*10)+'%"></div></div><div class="d-row-t">'+d.d+'</div></div>';}

// === Render ===
function render(){
  var f=filtered(),grid=document.getElementById('grid');
  document.getElementById('count').innerHTML='📋 <span>'+f.length.toLocaleString()+'</span> / '+all.length.toLocaleString()+' 名球员';
  if(R===0)grid.innerHTML='';
  if(f.length===0){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:3rem;color:#8b949e">无匹配球员</div>';return;}
  var end=Math.min(R+PAGE,f.length);
  for(var i=R;i<end;i++)grid.appendChild(card(f[i]));
  R=end;
}
function reRender(){R=0;render();}

// === Events ===
document.getElementById('ageMin').oninput=function(){var x=+this.value,y=+document.getElementById('ageMax').value;if(x>y)document.getElementById('ageMax').value=x;document.getElementById('ageDisplay').textContent=x+'-'+document.getElementById('ageMax').value;reRender();};
document.getElementById('ageMax').oninput=function(){var x=+this.value,y=+document.getElementById('ageMin').value;if(x<y)document.getElementById('ageMin').value=x;document.getElementById('ageDisplay').textContent=document.getElementById('ageMin').value+'-'+x;reRender();};
document.getElementById('posF').onchange=reRender;
document.getElementById('natF').onchange=reRender;
var st2;document.getElementById('search').oninput=function(){clearTimeout(st2);st2=setTimeout(reRender,300);};
[].forEach.call(document.querySelectorAll('.sort-btn'),function(b){b.onclick=function(){var k=b.dataset.s;if(sort===k)desc=!desc;else{sort=k;desc=k==='a';}[].forEach.call(document.querySelectorAll('.sort-btn'),function(x){x.classList.remove('active');});b.classList.add('active');reRender();};});

// === Scroll ===
var st1;window.addEventListener('scroll',function(){clearTimeout(st1);st1=setTimeout(function(){var g=document.getElementById('grid');if(!g.lastChild)return;var r=g.lastChild.getBoundingClientRect();if(r.top<window.innerHeight+600)render();},100);},{passive:true});

// === Start ===
render();
</script>
</body>
</html>
