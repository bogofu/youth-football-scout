<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Test</title></head>
<body style="background:#0d1117;color:#fff;font:2rem sans-serif;padding:2rem">
<h1>Loading...</h1>
<script src="players_data.js"></script>
<script>
(function(){
  var el = document.querySelector('h1');
  try {
    if (typeof DB !== 'undefined' && DB.pl) {
      el.textContent = '✅ OK! ' + DB.pl.length.toLocaleString() + ' players loaded';
      el.style.color = '#22c55e';
      var p = DB.pl[0];
      el.innerHTML += '<br><small>First: ' + p.n + ' | Age: ' + p.a + ' | Club: ' + p.c + ' | Rating: ' + p.o + '</small>';
    } else {
      el.textContent = '❌ DB not found';
      el.style.color = '#ef4444';
    }
  } catch(e) {
    el.textContent = '❌ Error: ' + e.message;
    el.style.color = '#ef4444';
  }
})();
</script>
</body></html>
