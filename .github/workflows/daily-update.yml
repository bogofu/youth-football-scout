name: Daily Player Update (12:00 CST)
on:
  schedule:
    - cron: '0 4 * * *'  # 12:00 Beijing time = 4:00 UTC
  workflow_dispatch:      # manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate 50,000 players
        run: python gen_50k.py

      - name: Build deploy files
        run: |
          python -c "
          import json
          with open('players_data.json','r',encoding='utf-8') as f:
              data = json.load(f)
          with open('players_data.js','w',encoding='utf-8') as f:
              f.write('const DB=')
              json.dump(data, f, ensure_ascii=False)
              f.write(';')
          print(f'Generated {len(data[\"pl\"])} players')
          "

      - name: Copy to deploy
        run: |
          cp players_data.js deploy/
          cp 50k.html deploy/index.html

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add players_data.json players_data.js deploy/
          git diff --staged --quiet || git commit -m "Daily update $(date +%Y-%m-%d)"
          git push origin main
          git push origin main:gh-pages --force
